name: Build unsigned desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Private Setpiece tag to build
        required: true
        default: v0.4.0

permissions:
  contents: write

concurrency:
  group: unsigned-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: bd35fbb8f4af0d67523780474de789047bf73ba2
          path: .acceptance-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/accept-macos-app.mjs
            scripts/macos-app-acceptance.test.mjs
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-preflight.mjs
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build unsigned Apple Silicon installer
        run: pnpm --filter setpiece-desktop release --arch=arm64 --official --unsigned
      - name: Verify Apple Silicon app
        shell: bash
        run: |
          version="$(node -p "require('./packages/openfilm/package.json').version")"
          app="apps/desktop/.release/arm64/out/mac-arm64/Setpiece.app"
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Setpiece")" = arm64
          test ! -e "$app/Contents/Resources/app-update.yml"
          test -s "$app/Contents/Resources/LICENSE"
          test -s "$app/Contents/Resources/NOTICE.md"
          test -s "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$app/Contents/Resources/LICENSES/OpenFilm-MIT.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Setpiece"
          hdiutil verify apps/desktop/.release/arm64/out/Setpiece-arm64.dmg
      - name: Check macOS acceptance guards
        run: node --test .acceptance-tools/scripts/macos-app-acceptance.test.mjs
      - name: Accept native Apple Silicon app from the disk image
        shell: bash
        run: |
          work="$RUNNER_TEMP/setpiece-macos-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "SETPIECE_MAC_ACCEPTANCE=$work" >> "$GITHUB_ENV"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          dmg="apps/desktop/.release/arm64/out/Setpiece-arm64.dmg"
          hash="$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)"
          node .acceptance-tools/scripts/accept-macos-app.mjs \
            --app apps/desktop/.release/arm64/out/mac-arm64/Setpiece.app \
            --dmg "$dmg" --dmg-sha256 "$hash" --arch arm64 --version "$version" \
            --work-root "$work" --execute
      - name: Preserve Apple Silicon runtime acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-acceptance
          path: |
            ${{ env.SETPIECE_MAC_ACCEPTANCE }}/macos-acceptance.json
            ${{ env.SETPIECE_MAC_ACCEPTANCE }}/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/.release/arm64/out/*.dmg
            apps/desktop/.release/arm64/out/*.zip

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: bd35fbb8f4af0d67523780474de789047bf73ba2
          path: .acceptance-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/accept-macos-app.mjs
            scripts/macos-app-acceptance.test.mjs
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-preflight.mjs
      - name: Require an Intel runner
        run: test "$(uname -m)" = x86_64
      - name: Build unsigned Intel installer
        run: pnpm --filter setpiece-desktop release --arch=x64 --official --unsigned
      - name: Verify Intel app
        shell: bash
        run: |
          version="$(node -p "require('./packages/openfilm/package.json').version")"
          app="apps/desktop/.release/x64/out/mac/Setpiece.app"
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Setpiece")" = x86_64
          test ! -e "$app/Contents/Resources/app-update.yml"
          test -s "$app/Contents/Resources/LICENSE"
          test -s "$app/Contents/Resources/NOTICE.md"
          test -s "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$app/Contents/Resources/LICENSES/OpenFilm-MIT.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Setpiece"
          hdiutil verify apps/desktop/.release/x64/out/Setpiece-x64.dmg
      - name: Check macOS acceptance guards
        run: node --test .acceptance-tools/scripts/macos-app-acceptance.test.mjs
      - name: Accept native Intel app from the disk image
        shell: bash
        run: |
          work="$RUNNER_TEMP/setpiece-macos-x64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "SETPIECE_MAC_ACCEPTANCE=$work" >> "$GITHUB_ENV"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          dmg="apps/desktop/.release/x64/out/Setpiece-x64.dmg"
          hash="$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)"
          node .acceptance-tools/scripts/accept-macos-app.mjs \
            --app apps/desktop/.release/x64/out/mac/Setpiece.app \
            --dmg "$dmg" --dmg-sha256 "$hash" --arch x64 --version "$version" \
            --work-root "$work" --execute
      - name: Preserve Intel runtime acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-acceptance
          path: |
            ${{ env.SETPIECE_MAC_ACCEPTANCE }}/macos-acceptance.json
            ${{ env.SETPIECE_MAC_ACCEPTANCE }}/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-x64
          if-no-files-found: error
          path: |
            apps/desktop/.release/x64/out/*.dmg
            apps/desktop/.release/x64/out/*.zip

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TryWorld2026/setpiece-private
          ref: bd35fbb8f4af0d67523780474de789047bf73ba2
          path: .acceptance-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/accept-windows-installer.ps1
            scripts/windows-installer-acceptance.test.mjs
          ssh-key: ${{ secrets.SETPIECE_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-preflight.mjs
      - name: Build unsigned Windows installer
        shell: pwsh
        run: pnpm --filter setpiece-desktop release --platform=win --arch=x64 --official --unsigned
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./packages/openfilm/package.json').version"
          $installer = 'apps\desktop\.release\win-x64\out\Setpiece-Setup-x64.exe'
          $unpacked = 'apps\desktop\.release\win-x64\out\win-unpacked'
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Windows installer is missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') { throw "Expected NotSigned, got $($signature.Status)" }
          $productVersion = (Get-Item -LiteralPath $installer).VersionInfo.ProductVersion
          if ($productVersion -ne $version) { throw "Unexpected product version: $productVersion" }
          foreach ($file in @(
            'resources\LICENSE',
            'resources\NOTICE.md',
            'resources\THIRD_PARTY_NOTICES.md',
            'resources\LICENSES\OpenFilm-MIT.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $unpacked $file))) { throw "Missing $file" }
          }
          if (Test-Path -LiteralPath (Join-Path $unpacked 'resources\app-update.yml')) {
            throw 'Manual-update build unexpectedly contains app-update.yml'
          }
      - name: Check installer acceptance guards
        shell: pwsh
        run: node --test .acceptance-tools/scripts/windows-installer-acceptance.test.mjs
      - name: Accept Windows install, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $feed = Invoke-RestMethod 'https://setpiece.tryworld.com.cn/updates/latest.json'
          if ($feed.version -ne '0.3.14') { throw 'Archive the reviewed 0.3.14 baseline before proceeding.' }
          $baseline = Join-Path $env:RUNNER_TEMP 'Setpiece-0.3.14-Setup-x64.exe'
          Invoke-WebRequest 'https://setpiece.tryworld.com.cn/downloads/Setpiece-Setup-x64.exe' -OutFile $baseline
          $candidate = (Resolve-Path 'apps/desktop/.release/win-x64/out/Setpiece-Setup-x64.exe').Path
          $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $work = Join-Path $env:RUNNER_TEMP ('setpiece-install-' + [guid]::NewGuid().ToString('N'))
          "SETPIECE_INSTALL_ACCEPTANCE=$work" >> $env:GITHUB_ENV
          & ./.acceptance-tools/scripts/accept-windows-installer.ps1 `
            -Baseline $baseline `
            -BaselineSha256 f7570fea11d4fb88c44eacedfaf7bf57c24ddd7e0d2dfeb4b26be0a47ae2cb9e `
            -Candidate $candidate -CandidateSha256 $candidateHash `
            -Version $version -WorkRoot $work -Execute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows installer acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance
          path: ${{ env.SETPIECE_INSTALL_ACCEPTANCE }}/installer-acceptance.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-x64
          if-no-files-found: error
          path: apps/desktop/.release/win-x64/out/*.exe

  publish:
    name: Stage reviewed installers as a draft
    needs: [macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Setpiece ${TAG#v} for Desktop**

          未签名桌面版是当前正式发布通道，包含项目库、完整编辑工作台、检查器、AI 助理与应用内更新。

          - macOS 13+ / Apple Silicon：DMG / ZIP
          - macOS 13+ / Intel：DMG / ZIP
          - Windows 10 / 11 / x64：EXE
          - 安装包未签名。macOS 首次打开可能被 Gatekeeper 阻止；Windows SmartScreen 可能显示未知发布者。
          - 应用内检测到新版本后，点击「更新」即可下载安装包、校验 SHA256，并重启完成安装。

          许可证与第三方声明随安装包分发。
          EOF
          mapfile -d '' files < <(find dist -maxdepth 1 -type f -print0)
          gh release create "$TAG" "${files[@]}" \
            --draft \
            --title "Setpiece ${TAG#v} · macOS + Windows" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            -R "$GITHUB_REPOSITORY"

